services:
  - type: web
    name: ohdismo
    runtime: node
    region: sa
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: BASE_URL
        value: https://ohdismo.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: MCP_API_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUMUP_API_KEY
        sync: false
      - key: SUMUP_MERCHANT_ID
        sync: false
      - key: SUMUP_CHAVE_PIX_SUA
        value: SUA.CHAVE.PIX.AQUI
    autoDeploy: true
    branch: main
